kube-prometheus-stack:

  grafana:
    enabled: false
    forceDeployDashboards: true
    defaultDashboardsEnabled: true
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "true"

  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        group_by: [ 'alertname', 'namespace' ]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'null'
      receivers:
        - name: 'null'

  prometheus:
    enabled: true
    prometheusSpec:
      replicas: 1
      resources:
        requests:
          cpu: 128m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 1Gi

      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: [ "ReadWriteOnce" ]
            resources:
              requests:
                storage: 3Gi

      retention: 3d
      retentionSize: 3GB

      scrapeInterval: 60s
      evaluationInterval: 60s

      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false

      remoteWrite:
        - url: http://mimir-distributed-distributor.observability.svc.cluster.local:8080/api/v1/push
          queueConfig:
            capacity: 5000
            maxSamplesPerSend: 1000
            maxShards: 2

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534

  prometheusOperator:
    enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    admissionWebhooks:
      certManager:
        enabled: true
        certificate:
          rotationPolicy: Always
        spec:
          privateKey:
            rotationPolicy: Always

  nodeExporter:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  kubeStateMetrics:
    enabled: true

  defaultRules:
    create: true
    rules:
      alertmanager: false
