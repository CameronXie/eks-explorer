loki:
  deploymentMode: Distributed

  loki:
    auth_enabled: false

    storage:
      type: s3
      s3:
        s3ForcePathStyle: true
        region: us-east-1
        insecure: false

    schemaConfig:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    ingester:
      chunk_encoding: snappy
    pattern_ingester:
      enabled: true
    tracing:
      enabled: true
    compactor:
      retention_enabled: true
      delete_request_store: s3
    ruler:
      enable_api: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
    analytics:
      reporting_enabled: false

  serviceAccount:
    create: true
    name: loki-sa

  lokiCanary:
    enabled: true

  test:
    enabled: false

  monitoring:
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "true"
    rules:
      enabled: true
    serviceMonitor:
      enabled: true

  bloomPlanner:
    replicas: 0
  bloomBuilder:
    replicas: 0
  bloomGateway:
    replicas: 0

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  singleBinary:
    replicas: 0
