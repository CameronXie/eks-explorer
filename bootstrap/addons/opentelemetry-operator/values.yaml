createCollector: true

collector:
  name: otel-collector
  mode: deployment
  replicas: 2
  serviceAccount: otel-collector
  image: "ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s:0.131.1"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

opentelemetry-operator:
  replicaCount: 1
  pdb:
    create: false
    minAvailable: 1

  manager:
    image:
      imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    leaderElection:
      enabled: true
    createRbacPermissions: false
    serviceMonitor:
      enabled: true
    prometheusRule:
      enabled: false

  kubeRBACProxy:
    enabled: true

  admissionWebhooks:
    create: true
    pods:
      failurePolicy: Ignore
    certManager:
      enabled: true
    autoGenerateCert:
      enabled: true
      recreate: true

  crds:
    create: true

  role:
    create: true
  clusterRole:
    create: true

  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532

  nodeSelector:
    kubernetes.io/os: linux

  automountServiceAccountToken: true
