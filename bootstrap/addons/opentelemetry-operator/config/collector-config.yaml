receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector-metrics
          scrape_interval: 15s
          static_configs:
            - targets: [ localhost:8888 ]

  k8s_cluster:
    auth_type: serviceAccount
    collection_interval: 10s
    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
    allocatable_types_to_report: [cpu, memory, ephemeral-storage, storage]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  k8sattributes:
    auth_type: serviceAccount
    extract:
      metadata:
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.namespace.name
        - k8s.node.name
        - k8s.pod.start_time
        - service.namespace
        - service.name
        - service.version
        - service.instance.id

  batch:
    send_batch_size: 10000
    timeout: 10s

exporters:
  debug:
    verbosity: basic

  otlphttp/tempo:
    endpoint: http://tempo-distributed-distributor.observability.svc.cluster.local:4318
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    timeout: 30s

  otlphttp/mimir:
    endpoint: http://mimir-distributed-distributor.observability.svc.cluster.local:8080/otlp
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    timeout: 30s

  otlphttp/loki:
    endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    timeout: 30s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  pprof:
    endpoint: 0.0.0.0:1777

service:
  telemetry:
    metrics:
      level: normal
  extensions: [ health_check, pprof ]
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ memory_limiter, k8sattributes, batch ]
      exporters: [ otlphttp/tempo, debug ]

    metrics:
      receivers: [ otlp, prometheus, k8s_cluster ]
      processors: [ memory_limiter, k8sattributes, batch ]
      exporters: [ otlphttp/mimir, debug ]

    logs:
      receivers: [ otlp ]
      processors: [ memory_limiter, k8sattributes, batch ]
      exporters: [ otlphttp/loki, debug ]
