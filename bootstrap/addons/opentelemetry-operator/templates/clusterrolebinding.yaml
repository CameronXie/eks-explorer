{{- if .Values.createCollector }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-otel-collector
  labels:
    app: otel-collector
    chart: {{ .Chart.Name }}
    release: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-otel-collector
subjects:
  - kind: ServiceAccount
    name: {{ .Values.collector.serviceAccount | default "otel-collector" }}
    namespace: {{ .Release.Namespace }}
{{- end }}