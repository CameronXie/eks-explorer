{{- if .Values.createCollector }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.collector.serviceAccount | default "otel-collector" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: otel-collector
    chart: {{ .Chart.Name }}
    release: {{ .Release.Name }}
automountServiceAccountToken: true
{{- end }}